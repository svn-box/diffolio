[package]
name = "diffolio-app"
version = "0.1.1"
description = "A considered file comparison workspace for macOS"
authors = ["Kelvin"]
edition = "2021"
license-file = "../LICENSE"
rust-version = "1.93"

[lib]
name = "diffolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-smoke = ["dep:block2", "dep:objc2-web-kit", "dep:objc2-app-kit", "dep:objc2-foundation"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
arboard = { version = "3.7", default-features = false }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = { version = "0.6", optional = true }
objc2-web-kit = { version = "0.3", optional = true, features = ["WKSnapshotConfiguration", "WKWebView", "block2"] }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSData", "NSDictionary", "NSString", "NSError"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# macOS 27 rejects stripped proc-macro dylibs; these build tools are never bundled.
[profile.release.build-override]
strip = false
